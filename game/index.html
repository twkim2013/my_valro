<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Third Person Strategy Game</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background: #000;
            color: white;
            overflow: hidden;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
        }
        #hp {
            color: #00ff00;
        }
        #hp-bars {
            position: absolute;
            top: 0;
            left: 0;
            pointer-events: none;
        }
        .hp-bar-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            transform: translateX(-50%);
        }
        .hp-bar-bg {
            width: 100px;
            height: 10px;
            background: #333;
            border: 1px solid #666;
        }
        .hp-bar-fill {
            height: 100%;
            background: #00ff00;
            transition: width 0.3s;
        }
        #skill-cooldowns {
            position: absolute;
            bottom: 10px;
            left: 10px;
        }
        .skill {
            margin: 5px;
            padding: 10px;
            background: #333;
            border-radius: 5px;
            display: inline-block;
        }
        .ready {
            background: #00ff00;
        }
        .cooldown {
            background: #ff0000;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="hp-bars"></div>
    <div id="ui">
        <div>HP: <span id="hp">1500</span>/1500</div>
        <div>Normal Attack: Ready</div>
    </div>
    <div id="skill-cooldowns">
        <div class="skill" id="skill1">Q: Air Bone (6s)</div>
        <div class="skill" id="skill2">E: Power Up (+75, 4s)</div>
        <div class="skill" id="skill3">R: Rage (100dmg, 5s, 10s cd)</div>
    </div>
    <div id="death-ui">
        <h2>You Died</h2>
        <p>You will respawn in <span id="respawn-timer">10</span> seconds</p>
    </div>

    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.156.0/build/three.module.js';
        import Player from './src/player.js';
        import Enemy from './src/enemy.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({antialias: true});
        renderer.setSize(window.innerWidth, window.innerHeight);
        container.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight.position.set(10, 10, 5);
        scene.add(directionalLight);

        // Ground
        const groundGeometry = new THREE.PlaneGeometry(50, 50);
        const groundMaterial = new THREE.MeshStandardMaterial({color: 0x90EE90});
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Player
        const player = new Player(scene, camera);

        // Dummy enemy
        const enemy = new Enemy(scene, new THREE.Vector3(0, 0, -5));
        enemy.setTargetPlayer(player);

        // UI update function
        function updateUI() {
            document.getElementById('hp').textContent = player.hp;

            // Skill cooldowns
            const skill1El = document.getElementById('skill1');
            const skill2El = document.getElementById('skill2');
            const skill3El = document.getElementById('skill3');

            skill1El.className = player.skillCooldowns[1] > 0 ? 'skill cooldown' : 'skill ready';
            skill2El.className = player.skillCooldowns[2] > 0 ? 'skill cooldown' : 'skill ready';
            skill3El.className = player.skillCooldowns[3] > 0 ? 'skill cooldown' : 'skill ready';

            skill1El.textContent = `Q: Air Bone (${player.skillCooldowns[1].toFixed(1)}s)`;
            skill2El.textContent = `E: Power Up (${player.skillCooldowns[2].toFixed(1)}s)`;
            skill3El.textContent = `R: Rage (${player.skillCooldowns[3].toFixed(1)}s)`;

            // Death UI
            const deathUI = document.getElementById('death-ui');
            if (player.isDead) {
                deathUI.style.display = 'block';
                document.getElementById('respawn-timer').textContent = player.respawnTimer.toFixed(1);
            } else {
                deathUI.style.display = 'none';
            }
        }

        let lastTime = performance.now();
        function animate(currentTime) {
            const dt = Math.min(0.1, (currentTime - lastTime) / 1000);
            lastTime = currentTime;

            player.update(dt, enemy);
            enemy.update(dt);

            updateUI();
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
